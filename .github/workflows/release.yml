name: Build and release

# Push a tag like v1.0.0 to build the Windows helper (.exe) and publish a GitHub Release.
# You can also run it by hand (Actions tab -> "Build and release" -> Run workflow):
# that only builds and uploads the files as a workflow artifact, no release is created.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the executable
        env:
          # Optional: a repository variable (Settings -> Secrets and variables -> Actions -> Variables).
          # The Application ID is public, so a variable is fine. If it is empty, users need a config.json.
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: node scripts/build-exe.js

      # Start the freshly built .exe and check that it answers on /health.
      # If the repository variable is set, the smoke test relies on the ID embedded in the .exe;
      # otherwise it passes a dummy ID through the environment.
      - name: Smoke test the executable
        shell: pwsh
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID == '' && '123456789012345678' || '' }}
          PORT: '18765'
        run: |
          $p = Start-Process -FilePath 'dist\pokebonk-presence-helper.exe' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/health'
                if ($r.ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'The executable did not answer on /health.' }
            Write-Host ('Health OK: ' + ($r | ConvertTo-Json -Compress))
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package the extension and write checksums
        shell: pwsh
        run: |
          Compress-Archive -Path 'extension\*' -DestinationPath 'dist\pokebonk-presence-extension.zip'
          Get-FileHash 'dist\pokebonk-presence-helper.exe', 'dist\pokebonk-presence-extension.zip' -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: pokebonk-presence-windows
          path: |
            dist/pokebonk-presence-helper.exe
            dist/pokebonk-presence-extension.zip
            dist/SHA256SUMS.txt

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            'dist\pokebonk-presence-helper.exe' `
            'dist\pokebonk-presence-extension.zip' `
            'dist\SHA256SUMS.txt' `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
